<div class="login-container">
  <div class="login-background"></div>

  <div class="login-card">
    <div class="login-header">
      <div class="medical-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.5,7A1.5,1.5 0 0,0 18,5.5H15A1.5,1.5 0 0,0 13.5,7V9H11V7A1.5,1.5 0 0,0 9.5,5.5H6A1.5,1.5 0 0,0 4.5,7V9H2V11H4.5V13A1.5,1.5 0 0,0 6,14.5H9.5A1.5,1.5 0 0,0 11,13V11H13.5V13A1.5,1.5 0 0,0 15,14.5H18A1.5,1.5 0 0,0 19.5,13V11H22V9H19.5V7M6,7H9.5V13H6V7M15,7H18V13H15V7Z" />
        </svg>
      </div>
      <h1 class="login-title">Sistema Médico Integral</h1>
      <p class="login-subtitle">Acceso al sistema de gestión médica</p>
    </div>

    <form class="login-form" (ngSubmit)="onLogin()" #loginForm="ngForm">
      <!-- Campo Usuario -->
      <div class="form-group">
        <label for="username" class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z" />
          </svg>
          Usuario
        </label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="credentials.username"
          class="form-input"
          [class.error]="hasError && !credentials.username"
          placeholder="Ingrese su usuario"
          required
          autocomplete="username"
        />
      </div>

      <!-- Campo Contraseña -->
      <div class="form-group">
        <label for="password" class="form-label">
          <svg class="label-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12,17A2,2 0 0,0 14,15C14,13.89 13.1,13 12,13A2,2 0 0,0 10,15A2,2 0 0,0 12,17M18,8A2,2 0 0,1 20,10V20A2,2 0 0,1 18,22H6A2,2 0 0,1 4,20V10C4,8.89 4.9,8 6,8H7V6A5,5 0 0,1 12,1A5,5 0 0,1 17,6V8H18M12,3A3,3 0 0,0 9,6V8H15V6A3,3 0 0,0 12,3Z" />
          </svg>
          Contraseña
        </label>
        <div class="password-input-container">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            [(ngModel)]="credentials.password"
            class="form-input"
            [class.error]="hasError && !credentials.password"
            placeholder="Ingrese su contraseña"
            required
            autocomplete="current-password"
          />
          <button
            type="button"
            class="password-toggle"
            (click)="togglePasswordVisibility()"
            aria-label="Mostrar/ocultar contraseña"
          >
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z" />
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="currentColor">
              <path d="M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.09L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.76,7.13 11.37,7 12,7Z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Mensaje de error -->
      <div *ngIf="errorMessage" class="error-message">
        <svg class="error-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M13,13H11V7H13M13,17H11V15H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" />
        </svg>
        {{ errorMessage }}
      </div>

      <!-- Botón de login -->
      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading || !loginForm.valid"
      >
        <div *ngIf="isLoading" class="loading-spinner"></div>
        <svg *ngIf="!isLoading" class="button-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M10,17V14H3V10H10V7L15,12L10,17M10,2H19A2,2 0 0,1 21,4V20A2,2 0 0,1 19,22H10A2,2 0 0,1 8,20V18H10V20H19V4H10V6H8V4A2,2 0 0,1 10,2Z" />
        </svg>
        <span>{{ isLoading ? 'Iniciando sesión...' : 'Iniciar Sesión' }}</span>
      </button>
    </form>

    <!-- Información de usuarios demo -->
    <div class="demo-info">
      <div class="demo-header">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M13,9H11V7H13M13,17H11V11H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z" />
        </svg>
        <span>Usuarios de prueba disponibles:</span>
      </div>
      <div class="demo-users">
        <div class="demo-user">
          <strong>admin</strong> - admin123 <span class="role">(Administrador)</span>
        </div>
        <div class="demo-user">
          <strong>doctor</strong> - doctor123 <span class="role">(Doctor)</span>
        </div>
        <div class="demo-user">
          <strong>recepcion</strong> - recepcion123 <span class="role">(Recepcionista)</span>
        </div>
      </div>
    </div>
  </div>
</div>
