<div class="navbar bg-blue-900 shadow-sm text-white">
  <div class="flex-none">
    <button
      class="btn btn-square btn-ghost text-white"
      (click)="toggleMenu()"
      [disabled]="!isAuthenticated"
      [class.opacity-50]="!isAuthenticated"
      [class.cursor-not-allowed]="!isAuthenticated"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-5 w-5 stroke-current">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
  </div>
  <div class="flex-1">
    <a class="btn btn-ghost text-xl text-white">Sistema Médico</a>
  </div>
  <div class="flex-none">
    <button
      *ngIf="isAuthenticated"
      class="btn btn-ghost text-white px-4"
      (click)="logout()"
      title="Cerrar sesión"
    >
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="inline-block h-5 w-5 stroke-current mr-2">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      Salir
    </button>
  </div>
</div>
